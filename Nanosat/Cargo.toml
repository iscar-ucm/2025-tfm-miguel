[package]
edition      = "2024"
name         = "Nanosat"
rust-version = "1.88"
version      = "0.1.0"
default-run  = "Nanosat"

[[bin]]
name = "Nanosat"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "=1.0.0", features = ["esp32c6", "unstable"] }

esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c6"] }

critical-section = "1.2.0"
esp-println = { version = "0.16.1", features = ["esp32c6", "log-04"] }
embassy-executor = { version = "0.9.1", features = ["arch-riscv32"] }
embassy-time = { version = "0.5.0", default-features = false }
embassy-sync = "0.7.2"
#esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6"] }
esp-rtos = { version = "0.2.0", features = ["embassy", "esp32c6", "esp-radio"] }
esp-radio ={ version = "0.17.0", features = ["esp32c6", "wifi", "log-04", "unstable"] }
embassy-net = { version = "0.8.0", features = ["tcp", "dhcpv4"] }
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "esp32c6", "println"] }
pd_rw_imu = { path = "../PD-RW-IMU" }
xdevs-no-std = { version = "0.3.0", features = ["embassy"] }
#xdevs-no-std = { git = "https://github.com/iscar-ucm/xdevs_no_std.rs.git",  branch="component2", features = ["embassy"] }
nalgebra = { version = "0.34.1", default-features = false, features = ["libm"] }
libm = "0.2.15"
bno055 = "=0.4.0"
rust-mqtt = { version = "0.5.1", default-features = false, features = ["v5", "bump"] }
embedded-io-async = "0.7"
static_cell = "2"
esp-alloc = { version = "0.9.0", default-features = false, features = ["esp32c6"] }
embassy-futures = { version = "0.1.2" }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false

[features]
simulation = []
hardware = []
default = ["hardware"]